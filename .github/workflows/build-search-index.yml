name: Validate public search index

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "search-index.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-public-search-index
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        run: python3 --version
      - name: Generate and validate public index
        run: python3 scripts/build-search-index.py
