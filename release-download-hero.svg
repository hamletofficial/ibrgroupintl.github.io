      <path d="M15 20v164l128 77V150Z" fill="#1d4ed8" stroke="#93c5fd" stroke-width="3" stroke-linejoin="round"/>
      <path d="M143 150 283 74v164l-140 23Z" fill="#0c2e81" stroke="#93c5fd" stroke-width="3" stroke-linejoin="round"/>
      <path d="m15 20 140-20 128 74-140 76Z" fill="url(#box)" stroke="#dbeafe" stroke-width="3" stroke-linejoin="round"/>
      <path d="m143 150 140-76v35l-140 79Z" fill="#60a5fa" opacity=".7"/>
      <path d="m92 9 129 74" stroke="#2563eb" stroke-width="3" opacity=".7"/>
      <rect x="116" y="50" width="55" height="69" rx="9" fill="#1e40af" stroke="#dbeafe" stroke-width="3"/>
      <path d="M143 64v27m-11-11 11 11 11-11" fill="none" stroke="#eff6ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <g transform="translate(1160 460)">
