<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Hamlet stable release download illustration</title>
  <desc id="desc">A polished software package and download arrow with circuit details on a dark slate and royal blue gradient.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset=".48" stop-color="#172554"/>
      <stop offset="1" stop-color="#1746b8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#263d70"/><stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93c5fd"/><stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".38" stop-color="#ffffff" stop-opacity=".04"/>
      <stop offset=".5" stop-color="#a5f3fc" stop-opacity=".52"/>
      <stop offset=".62" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#bfdbfe" stroke-opacity=".075" stroke-width="1"/>
      <circle cx="0" cy="0" r="2" fill="#bfdbfe" fill-opacity=".22"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1265" cy="395" r="300" fill="#2563eb" opacity=".16" filter="url(#glow)"/>
  <g fill="none" stroke="#93c5fd" stroke-width="3" stroke-opacity=".28">
    <path d="M85 620h210l60-60h145"/><path d="M105 682h275l42-42h120"/>
    <path d="M1170 170h145l55 55h145"/><path d="M1190 225h86l52 52h130"/>
    <path d="M1220 675h130l75-75h90"/><path d="M1020 760h110l48-48h170"/>
  </g>
