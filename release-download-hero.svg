      <path d="M56 13v91" stroke="#dbeafe" stroke-linecap="round" stroke-width="18"/>
      <path d="M25 72 56 103 87 72" fill="none" stroke="#dbeafe" stroke-linecap="round" stroke-linejoin="round" stroke-width="18"/>
      <path d="M8 122v20q0 12 12 12h72q12 0 12-12v-20" fill="none" stroke="#60a5fa" stroke-linecap="round" stroke-width="8"/>
    </g>
