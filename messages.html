<script>

 try{if(!firebase.apps.length)firebase.initializeApp(window.firebaseConfig)}catch(e){return}
 const auth=firebase.auth(),db=firebase.firestore(),storage=firebase.storage(),status=document.getElementById('mailStatus'),layout=document.getElementById('mailLayout'),loginCard=document.getElementById('loginCard'),list=document.getElementById('conversationList'),body=document.getElementById('threadBody'),title=document.getElementById('threadTitle'),compose=document.getElementById('composeForm'),input=document.getElementById('messageInput'),attachmentInput=document.getElementById('attachmentInput'),attachmentButton=document.getElementById('attachmentButton'),attachmentSelection=document.getElementById('attachmentSelection'),pinnedStrip=document.getElementById('pinnedStrip'),pinnedList=document.getElementById('pinnedList'),signOut=document.getElementById('signOutBtn'),signIn=document.getElementById('signInLink'),conversationSearch=document.getElementById('conversationSearch');

 function renderConversations(){list.innerHTML='';updateUnreadIndicator();if(deleteConversationBtn){deleteConversationBtn.disabled=!activeUid;deleteConversationBtn.title=activeUid?'Delete this conversation from Firestore':'Select a conversation first';}if(closeConversationBtn){closeConversationBtn.disabled=!activeUid;closeConversationBtn.textContent=showArchived?'Return to Mailbox':'Close Conversation';closeConversationBtn.title=activeUid?(showArchived?'Return this conversation to the mailbox':'Move this conversation to your private Archived Messages folder'):'Select a conversation first';}if(archivedMessagesBtn){archivedMessagesBtn.textContent=showArchived?'← Back to Mailbox':'📁 Archived Messages';}const query=(conversationSearch.value||'').trim().toLocaleLowerCase();const map=new Map();allMessages.forEach(m=>{const other=m.senderUid===me.uid?m.recipientUid:m.senderUid;if(other===me.uid)return;const old=map.get(other);if(!old||((m.sentAt?.toMillis?.()||0)>(old.sentAt?.toMillis?.()||0)))map.set(other,m)});if(activeUid&&!map.has(activeUid))map.set(activeUid,{senderUid:me.uid,recipientUid:activeUid,body:''});

 }
 async function toggleImportant(message){if(!me||!message||!message.id)return;const flagged=flaggedMessageIds.has(message.id),ref=db.collection('userMessageFlags').doc(me.uid).collection('flaggedMessages').doc(message.id);if(flagImportantBtn)flagImportantBtn.disabled=true;try{if(flagged){await ref.delete();flaggedMessageIds.delete(message.id)}else{await ref.set({messageId:message.id,flaggedAt:firebase.firestore.FieldValue.serverTimestamp()});flaggedMessageIds.add(message.id)}renderConversations();renderThread()}catch(e){console.error('Unable to flag message as important',e);alert('The Important flag could not be saved. Check your Firestore rules and try again.')}finally{updateFlagButton()}}
