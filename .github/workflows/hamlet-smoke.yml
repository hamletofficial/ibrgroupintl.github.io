name: Hamlet CRM smoke and security tests

on:
  push:
    branches: [main]
    paths:
      - 'app/hamlet/index.html'
      - 'messages.html'
      - 'functions/index.js'
      - 'firestore.rules'
      - 'storage.rules'
      - 'site-search.js'
      - 'search-index.json'
      - 'tests/**'
      - '.github/workflows/hamlet-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/hamlet/index.html'
      - 'messages.html'
      - 'functions/index.js'
      - 'firestore.rules'
      - 'storage.rules'
      - 'tests/**'
      - '.github/workflows/hamlet-smoke.yml'

permissions:
  contents: read

jobs:
  static-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Parse client and Cloud Function JavaScript
        run: node --test tests/hamlet-static.test.cjs

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save --ignore-scripts --package-lock=false playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise Hamlet deal, saved-search and document flows
        run: node --test tests/hamlet-browser.test.cjs

  firebase-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated Firebase test dependencies
        run: npm install --no-save --ignore-scripts --package-lock=false firebase-tools firebase @firebase/rules-unit-testing
      - name: Test Firestore and Storage rules in emulators
        run: npx firebase-tools emulators:exec --only firestore,storage --project demo-hamlet-rules "node --test tests/hamlet-rules.test.cjs"
