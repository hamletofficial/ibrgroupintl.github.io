name: Publish Hamlet for Windows

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing Windows beta tag to build and publish"
        required: true
        default: "hamlet-windows-v0.1.0-beta.1"
        type: string
  push:
    tags:
      - "hamlet-windows-v*"

permissions:
  contents: write

concurrency:
  group: hamlet-windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install desktop dependencies
        working-directory: desktop/hamlet-windows
        run: npm install

      - name: Run desktop security and syntax tests
        working-directory: desktop/hamlet-windows
        run: npm run check

      - name: Build Windows installer
        working-directory: desktop/hamlet-windows
        run: npm run pack:win

      - name: Validate installer and calculate SHA-256
        shell: pwsh
        working-directory: desktop/hamlet-windows
        run: |
          $installers = @(Get-ChildItem -Path "release" -Filter "*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer; found $($installers.Count)."
          }
          $installer = $installers[0]
          if ($installer.Length -lt 1MB) {
            throw "Installer is unexpectedly small ($($installer.Length) bytes); refusing to publish."
          }
          $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash
          "$hash  $($installer.Name)" | Set-Content -Path "release/SHA256SUMS.txt" -Encoding ascii
          Write-Host "Installer: $($installer.Name)"
          Write-Host "Size: $($installer.Length) bytes"
          Write-Host "SHA-256: $hash"

      - name: Publish GitHub prerelease and attach installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: hamlet for Windows — Beta 1
          body_path: desktop/hamlet-windows/RELEASE-NOTES.md
          prerelease: true
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            desktop/hamlet-windows/release/*.exe
            desktop/hamlet-windows/release/SHA256SUMS.txt
