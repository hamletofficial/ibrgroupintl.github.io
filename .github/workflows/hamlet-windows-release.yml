name: Build and publish Hamlet v1.04 for Windows

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to build and publish"
        required: true
        default: "v1.04"
        type: string
  push:
    tags:
      - "v1.04"

permissions:
  contents: write

concurrency:
  group: hamlet-v1-04-windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-and-publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/hamlet-windows/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop/hamlet-windows
        run: npm ci

      - name: Run desktop syntax, security and unit tests
        working-directory: desktop/hamlet-windows
        run: npm run check

      - name: Verify unified version number
        working-directory: desktop/hamlet-windows
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          if ($version -ne "1.04.0") {
            throw "Expected Windows package version 1.04.0, found $version."
          }

      - name: Build Windows installer
        working-directory: desktop/hamlet-windows
        run: npm run pack:win

      - name: Validate installer and calculate SHA-256
        shell: pwsh
        working-directory: desktop/hamlet-windows
        run: |
          $installers = @(Get-ChildItem -Path "release" -Filter "*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer; found $($installers.Count)."
          }
          $installer = $installers[0]
          if ($installer.Name -ne "hamlet-Setup-1.04.0.exe") {
            throw "Unexpected installer filename: $($installer.Name)"
          }
          if ($installer.Length -lt 1MB) {
            throw "Installer is unexpectedly small ($($installer.Length) bytes); refusing to publish."
          }
          $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash
          "$hash  $($installer.Name)" | Set-Content -Path "release/SHA256SUMS.txt" -Encoding ascii
          Write-Host "Installer: $($installer.Name)"
          Write-Host "Size: $($installer.Length) bytes"
          Write-Host "SHA-256: $hash"

      - name: Publish Hamlet v1.04 Windows prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Hamlet v1.04 — Windows
          body_path: desktop/hamlet-windows/RELEASE-NOTES.md
          prerelease: true
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            desktop/hamlet-windows/release/hamlet-Setup-1.04.0.exe
            desktop/hamlet-windows/release/SHA256SUMS.txt
