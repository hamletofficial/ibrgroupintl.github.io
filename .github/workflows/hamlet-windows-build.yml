name: Build Hamlet for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - feature/hamlet-windows-desktop
    paths:
      - "desktop/hamlet-windows/**"
      - ".github/workflows/hamlet-windows-build.yml"

concurrency:
  group: hamlet-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/hamlet-windows
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: npm run check
      - name: Build Windows installer
        run: npm run pack:win
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: hamlet-windows-installer
          path: desktop/hamlet-windows/release/*.exe
          if-no-files-found: error
          retention-days: 14
