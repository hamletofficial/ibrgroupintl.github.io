<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#0284c7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex, follow">
  <title>Member Directory — Impact in Business Recruitment</title>
  <link rel="stylesheet" href="/resource-centre.css">
  <link rel="stylesheet" href="/index.css">
  <link rel="stylesheet" href="/mobile-compat.css">
  <link rel="stylesheet" href="/page-transition.css">
  <style>
    :root { --muted: #475569; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Open Sans', Arial, sans-serif; color: #0f172a; background: linear-gradient(180deg, #f5f9ff 0%, #ffffff 100%); }
    .page-wrapper { background: #fff; max-width: 1920px; min-height: 100vh; margin: 0 auto; box-shadow: 0 0 20px rgba(0, 0, 0, .1) }
    .directory-shell { max-width: 1100px; margin: 2rem auto 3rem; padding: 0 1rem; }
    .directory-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 2rem; gap: 1.5rem; }
    .directory-title { color: #092a4b; font-size: 2rem; font-weight: 800; margin: 0; letter-spacing: -1px; }
    .directory-search { flex: 1 1 320px; max-width: 340px; display: flex; align-items: center; background: #f8fafc; border-radius: 8px; border: 1px solid #dbe3ee; padding: 0.5rem 1rem; }
    .directory-search input { border: none; background: transparent; font-size: 1rem; width: 100%; outline: none; color: #0f172a; padding: 0.5rem 0; }
    .directory-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; }
    .profile-card { background: #fff; border: 1px solid #dbe3ee; border-radius: 18px; box-shadow: 0 8px 32px rgba(2,6,23,.10); padding: 2rem 1.5rem 1.5rem 1.5rem; display: flex; flex-direction: column; align-items: center; transition: box-shadow 0.2s, transform 0.2s; position: relative; min-height: 340px; }
    .profile-card:hover { box-shadow: 0 16px 40px rgba(2,6,23,.16); transform: translateY(-4px) scale(1.025); }
    .profile-card img { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 2.5px solid #0284c7; background: #f8fafc; margin-bottom: 1rem; box-shadow: 0 2px 8px rgba(2,132,199,0.08); }
    .profile-card .name { font-weight: 700; color: #0284c7; font-size: 1.18rem; margin-bottom: 0.25rem; text-align: center; text-decoration: none; letter-spacing: -0.5px; }
    .profile-card .bio { color: #475569; font-size: 1.01rem; margin-bottom: 0.7rem; text-align: center; min-height: 2.5em; max-width: 90%; line-height: 1.5; }
    .online-status { display: inline-flex; align-items: center; gap: 6px; margin: 0 0 0.7rem; color: #16a34a; font-size: 0.9rem; font-weight: 700; }
    .online-status-dot { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; display: inline-block; box-shadow: 0 0 0 2px rgba(34,197,94,.12); }
    .directory-status { color: var(--muted); text-align: center; margin: 1.5rem 0; font-size: 1.08rem; }
    .sidebar-menu-shell {
      display: none;
      position: fixed;
      top: 88px;
      left: 24px;
      width: 220px;
      background: #ffffff;
      border: 1px solid #dbe3ee;
      border-radius: 12px;
      box-shadow: 0 10px 24px rgba(2, 6, 23, 0.12);
      padding: 10px 0;
      z-index: 950;
    }
    .sidebar-menu-link {
      display: block;
      padding: 11px 14px;
      margin: 2px 8px;
      border-radius: 8px;
      color: #092a4b;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }
    .sidebar-menu-link:hover,
    .sidebar-menu-link:focus {
      background: #092a4b;
      color: #ffffff;
      transform: translateX(3px);
    }
    .sidebar-menu-icon {
      display: inline-block;
      width: 1.25em;
      min-width: 1.25em;
      text-align: center;
      margin-right: 0.65em;
      font-size: 1.15em;
      vertical-align: middle;
      opacity: 0.88;
    }
    @media (max-width: 980px) {
      .sidebar-menu-shell {
        position: static;
        width: 100%;
        max-width: 900px;
        margin: 12px auto;
      }
      body.has-sidebar #protected-content {
        margin-left: 0;
      }
    }
    @media (max-width: 900px) {
      .resource-nav, .site-header {
        background: #0B2A6F !important;
        border-bottom: 1px solid #0B2A6F !important;
        backdrop-filter: none !important;
      }
    }
  </style>
</head>
<body class="auth-pending">
  <div class="page-wrapper">
    <header class="resource-nav" role="banner">
      <div class="container container-nav">
        <div class="logo" style="display:flex;align-items:center;gap:12px">
          <span class="site-title" style="color:lightgrey">Premium</span>
        </div>
        <div class="user-menu" style="margin-left:auto;display:flex;align-items:center;gap:12px">
          <div class="auth-profile-chip" data-auth-profile>
            <img class="auth-profile-photo" data-auth-photo src="/100.png" alt="Profile photo">
            <span class="auth-profile-name" data-auth-name></span>
          </div>
          <a class="btn btn-outline nav-login" href="/login.html" id="signInLink">Sign In</a>
          <button class="btn btn-outline" id="signOutBtn" style="display:none">Sign Out</button>
        </div>
      </div>
    </header>
    <nav id="topNavMenu" class="sidebar-menu-shell" aria-label="Members navigation">
      <a class="sidebar-menu-link" href="https://www.ibrecruitment.com"><span class="sidebar-menu-icon" aria-hidden="true">🏠</span> Home</a>
      <a class="sidebar-menu-link" href="/editprofile.html"><span class="sidebar-menu-icon" aria-hidden="true">👤</span> Edit Profile</a>
      <a class="sidebar-menu-link" href="/members.html"><span class="sidebar-menu-icon" aria-hidden="true">🧑‍🤝‍🧑</span> Members Area</a>
      <a class="sidebar-menu-link" href="/insights.html"><span class="sidebar-menu-icon" aria-hidden="true">💡</span> Insights Archive</a>
      <a class="sidebar-menu-link" href="/requests.html"><span class="sidebar-menu-icon" aria-hidden="true">📋</span> Media Relations</a>
      <a class="sidebar-menu-link" href="/settings.html"><span class="sidebar-menu-icon" aria-hidden="true">⚙️</span> Account Settings</a>
      <a class="sidebar-menu-link" href="/contact.html"><span class="sidebar-menu-icon" aria-hidden="true">✉️</span> Contact</a>
      <a class="sidebar-menu-link" href="/directory.html"><span class="sidebar-menu-icon" aria-hidden="true">📇</span> Member Directory</a>
      <a class="sidebar-menu-link" href="/invoice.html"><span class="sidebar-menu-icon" aria-hidden="true">💳</span> Payments</a>
    </nav>
    <script>
      function updateSidebarVisibility() {
        var sidebar = document.getElementById('topNavMenu');
        if (document.body.classList.contains('has-sidebar')) {
          sidebar.style.display = 'block';
        } else {
          sidebar.style.display = 'none';
        }
      }
      document.addEventListener('DOMContentLoaded', updateSidebarVisibility);
      var observer = new MutationObserver(updateSidebarVisibility);
      observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });
    </script>
    <main class="directory-shell" role="main">
      <div class="directory-header">
        <h1 class="directory-title">Member Directory</h1>
        <form class="directory-search" onsubmit="return false;">
          <input id="directorySearchInput" type="search" placeholder="Search members by name or bio..." aria-label="Search members">
        </form>
      </div>
      <div id="directoryStatus" class="directory-status">Loading directory...</div>
      <div id="directoryGrid" class="directory-grid" style="display:none"></div>
    </main>
    <footer class="resource-footer" role="contentinfo">
      <div class="container" style="text-align:center">
        <div style="margin-bottom:4px;color:var(--muted);font-size:0.95rem;">v.03 (Beta)</div>
        <p style="margin:0;color:var(--muted)">&copy; 2026 Impact in Business Recruitment Group Limited. All rights reserved.</p>
      </div>
    </footer>
  </div>
  <script defer src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script defer src="/firebase-config.js"></script>
  <script defer src="/header-profile.js"></script>
  <script defer src="/mobile-compat.js"></script>
  <script defer src="/page-transition.js"></script>
  <script>
    window.addEventListener('load', function () {
      if (!window.firebase || !window.firebaseConfig) return;
      try { firebase.initializeApp(window.firebaseConfig); } catch (e) {}
      const auth = firebase.auth();
      const db = firebase.firestore();
      const DEFAULT_PUBLIC_IMAGE = '/100.png';
      const directoryStatus = document.getElementById('directoryStatus');
      const directoryGrid = document.getElementById('directoryGrid');
      const signOutBtn = document.getElementById('signOutBtn');
      const signInLink = document.getElementById('signInLink');
      function showSignedOut() {
        directoryStatus.textContent = 'Sign in to view the member directory.';
        directoryGrid.style.display = 'none';
        signOutBtn.style.display = 'none';
        signInLink.style.display = 'inline-flex';
        document.body.classList.remove('auth-pending','has-sidebar');
      }
      async function showSignedIn(user) {
        directoryStatus.textContent = 'Loading directory...';
        directoryGrid.style.display = 'grid';
        signOutBtn.style.display = 'inline-flex';
        signInLink.style.display = 'none';
        document.body.classList.remove('auth-pending');
        document.body.classList.add('has-sidebar');
        try {
          const snap = await db.collection('publicProfiles').where('isPublic', '==', true).get();
          if (snap.empty) {
            directoryStatus.textContent = 'No member profiles found.';
            directoryGrid.innerHTML = '';
            return;
          }
          directoryStatus.textContent = '';
          directoryGrid.innerHTML = '';
          snap.forEach(doc => {
            const data = doc.data() || {};
            const img = data.imageDataUrl || DEFAULT_PUBLIC_IMAGE;
            const name = (data.firstName || '') + ' ' + (data.lastName || '');
            let bio = data.bio || '';
            bio = bio.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
            const card = document.createElement('div');
            card.className = 'profile-card';

            const lastLoginValue = data.lastLogin || data['Last Login'];
            let lastLoginDate = null;
            if (lastLoginValue && typeof lastLoginValue.toDate === 'function') {
              lastLoginDate = lastLoginValue.toDate();
            } else if (lastLoginValue instanceof Date) {
              lastLoginDate = lastLoginValue;
            } else if (lastLoginValue) {
              const parsed = new Date(lastLoginValue);
              if (!isNaN(parsed.getTime())) lastLoginDate = parsed;
            }

            const loginAge = lastLoginDate ? Date.now() - lastLoginDate.getTime() : Infinity;
            const isOnlineNow = loginAge >= 0 && loginAge <= 60 * 60 * 1000;
            const onlineMarkup = isOnlineNow
              ? '<div class="online-status" aria-label="Online Now"><span class="online-status-dot" aria-hidden="true"></span>Online Now</div>'
              : '';

            card.innerHTML = `
              <img src="${img}" alt="${name} profile photo">
              <div class="name">${name}</div>
              ${onlineMarkup}
              <div class="bio">${bio}</div>
            `;
            directoryGrid.appendChild(card);
          });
        } catch (err) {
          directoryStatus.textContent = 'Failed to load directory.';
        }
      }
      auth.onAuthStateChanged(async (user) => {
        if (!user) { showSignedOut(); return; }
        await showSignedIn(user);
      });
      if (signOutBtn) signOutBtn.addEventListener('click', () => auth.signOut());
      function filterDirectoryCards(query) {
        const q = String(query || '').trim().toLowerCase();
        const cards = Array.from(directoryGrid.children);
        let visible = 0;
        cards.forEach(card => {
          const name = (card.querySelector('.name')?.textContent || '').toLowerCase();
          const bio = (card.querySelector('.bio')?.textContent || '').toLowerCase();
          if (!q || name.includes(q) || bio.includes(q)) {
            card.style.display = '';
            visible++;
          } else {
            card.style.display = 'none';
          }
        });
        directoryStatus.textContent = visible === 0 ? 'No members match your search.' : '';
      }
      const searchInput = document.getElementById('directorySearchInput');
      if (searchInput) {
        searchInput.addEventListener('input', function() {
          filterDirectoryCards(searchInput.value);
        });
      }
    });
  </script>
</body>
</html>
