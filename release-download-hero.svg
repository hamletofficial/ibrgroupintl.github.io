    <circle cx="0" cy="0" r="51" fill="#2563eb" fill-opacity=".25" stroke="#60a5fa" stroke-width="2"/>
    <path d="m-22 1 15 16 31-35" fill="none" stroke="#dbeafe" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g fill="#bfdbfe" opacity=".8">
    <circle cx="282" cy="270" r="4"/><circle cx="310" cy="306" r="3"/><circle cx="1300" cy="370" r="4"/>
    <circle cx="1368" cy="440" r="3"/><circle cx="1040" cy="130" r="3"/><circle cx="103" cy="500" r="4"/>
  </g>
  <path d="M0 865Q390 780 720 850T1600 830v70H0Z" fill="#071d4a" opacity=".5"/>
  <g class="glare-sweep" pointer-events="none" opacity=".72">
    <rect x="-520" y="-420" width="520" height="1800" fill="url(#glare)" transform="rotate(18 0 0)"/>
  </g>
  <style>
    .glare-sweep{animation:glareSweep 9s ease-in-out infinite}
    @keyframes glareSweep{0%,12%{transform:translateX(-420px);opacity:0}22%{opacity:.72}52%,100%{transform:translateX(2050px);opacity:0}}
    @media(prefers-reduced-motion:reduce){.glare-sweep{animation:none;opacity:.18}}
