    <circle cx="1315" cy="170" r="6"/><circle cx="1328" cy="277" r="6"/><circle cx="1350" cy="675" r="6"/>
  </g>
  <g transform="translate(385 188)">
    <ellipse cx="410" cy="505" rx="370" ry="54" fill="#030712" opacity=".38"/>
    <path d="M100 50Q100 28 122 28h382q22 0 22 22v264H100Z" fill="url(#panel)" stroke="#93c5fd" stroke-opacity=".78" stroke-width="4"/>
    <rect x="126" y="55" width="374" height="224" rx="10" fill="#0b1120" stroke="#60a5fa" stroke-opacity=".65" stroke-width="2"/>
