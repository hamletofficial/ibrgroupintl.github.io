name: Optimise Hamlet carousel images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimise-carousel-webp.yml'
      - 'assets/images/ipad-grid-iii.png'
      - 'assets/images/ipad.png'
      - 'assets/images/ipad-grid.png'
      - 'assets/images/ipad-backup.png'
      - 'assets/images/ipad-grid-i.png'
      - 'assets/images/ipad-grid-ii.png'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install WebP encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Create optimised carousel images
        shell: bash
        run: |
          set -euo pipefail
          for name in ipad-grid-iii ipad ipad-grid ipad-backup ipad-grid-i ipad-grid-ii; do
            source="assets/images/${name}.png"
            target="assets/images/${name}.webp"
            if [ -f "$source" ]; then
              cwebp -quiet -q 78 -m 6 -mt -resize 1600 0 "$source" -o "$target"
              echo "$source: $(du -h "$source" | cut -f1) -> $target: $(du -h "$target" | cut -f1)"
            else
              echo "Missing expected source: $source" >&2
              exit 1
            fi
          done

      - name: Point carousel at WebP assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          html = path.read_text()
          names = ["ipad-grid-iii", "ipad", "ipad-grid", "ipad-backup", "ipad-grid-i", "ipad-grid-ii"]
          for name in names:
              html = html.replace(f"/assets/images/{name}.png", f"/assets/images/{name}.webp")
          path.write_text(html)
          PY

      - name: Commit WebP assets and carousel references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/images/ipad-grid-iii.webp assets/images/ipad.webp assets/images/ipad-grid.webp assets/images/ipad-backup.webp assets/images/ipad-grid-i.webp assets/images/ipad-grid-ii.webp
          if git diff --cached --quiet; then
            echo "Optimised WebP files are already up to date."
            exit 0
          fi
          git commit -m "Optimise homepage carousel images"
          git push
