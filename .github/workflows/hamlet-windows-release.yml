name: Build and publish Hamlet v1.04.02 for Windows

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to build and publish"
        required: true
        default: "v1.04.02"
        type: string
  push:
    branches:
      - main
    paths:
      - "desktop/hamlet-windows/**"
      - ".github/workflows/hamlet-windows-release.yml"
    tags:
      - "v1.04*"

permissions:
  contents: write

concurrency:
  group: hamlet-v1-04-02-windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-and-publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install desktop dependencies
        working-directory: desktop/hamlet-windows
        run: npm install

      - name: Run desktop syntax, security and unit tests
        working-directory: desktop/hamlet-windows
        run: npm run check

      - name: Verify unified version number
        working-directory: desktop/hamlet-windows
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          if ($version -ne "1.4.2") {
            throw "Expected Windows package version 1.4.2, found $version."
          }

      - name: Build Windows installer
        working-directory: desktop/hamlet-windows
        run: npm run pack:win

      - name: Validate installer and calculate SHA-256
        shell: pwsh
        working-directory: desktop/hamlet-windows
        run: |
          $installers = @(Get-ChildItem -Path "release" -Filter "*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer; found $($installers.Count)."
          }
          $installer = $installers[0]
          if ($installer.Name -ne "hamlet-Setup-1.4.2.exe") {
            throw "Unexpected installer filename: $($installer.Name)"
          }
          if ($installer.Length -lt 1MB) {
            throw "Installer is unexpectedly small ($($installer.Length) bytes); refusing to publish."
          }
          $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash
          "$hash  $($installer.Name)" | Set-Content -Path "release/SHA256SUMS.txt" -Encoding ascii
          $checksumLine = (Get-Content -Path "release/SHA256SUMS.txt" -Raw).Trim()
          if ($checksumLine -notmatch '^[A-Fa-f0-9]{64}  hamlet-Setup-1\.4\.2\.exe$') {
            throw "Checksum file does not match the required SHA-256 format."
          }
          if ($checksumLine.Substring(0, 64).ToUpperInvariant() -ne $hash) {
            throw "Checksum file hash does not match the built installer."
          }
          Write-Host "Size: $($installer.Length) bytes"
          Write-Host "SHA-256: $hash"

      - name: Retain verified installer and checksum
        uses: actions/upload-artifact@v4
        with:
          name: hamlet-windows-${{ github.run_number }}
          path: |
            desktop/hamlet-windows/release/hamlet-Setup-1.4.2.exe
            desktop/hamlet-windows/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish Hamlet v1.04.02 Windows release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v1.04')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Hamlet v1.04.02 — Windows
          body_path: desktop/hamlet-windows/RELEASE-NOTES.md
          prerelease: false
          make_latest: true
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            desktop/hamlet-windows/release/hamlet-Setup-1.4.2.exe
            desktop/hamlet-windows/release/SHA256SUMS.txt
