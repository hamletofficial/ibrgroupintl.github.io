<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="robots" content="noindex,nofollow">
  <title>Brief Archive | Impact in Business Recruitment</title>
  <link rel="stylesheet" href="/mobile-compat.css">
  <link rel="stylesheet" href="/legal-pages.css">
  <style>
    :root { --navy:#07111f; --ink:#092a4b; --muted:#60748a; --line:#dbe3ee; --surface:#fff; --soft:#f5f9fd; --accent:#0a66c2; }
    * { box-sizing:border-box; }
    body { margin:0; background:linear-gradient(180deg,#07111f 0 170px,#f5f8fc 170px 100%); color:var(--ink); font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; min-height:100vh; }
    .archive-main { width:min(1100px,calc(100% - 32px)); margin:0 auto; padding:48px 0 72px; }
    .archive-hero { color:#fff; margin-bottom:24px; }
    .archive-hero h1 { margin:0 0 8px; font-size:clamp(1.8rem,4vw,2.5rem); letter-spacing:-.03em; }
    .archive-hero p { margin:0; color:#c6d5e5; max-width:700px; line-height:1.6; }
    .archive-toolbar { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
    .archive-count { font-weight:700; color:#e6eef7; }
    .archive-actions { display:flex; gap:10px; flex-wrap:wrap; }
    .archive-actions a,.archive-actions button { appearance:none; border:1px solid #cbd8e6; background:#fff; color:var(--ink); border-radius:10px; padding:10px 15px; font:inherit; font-weight:700; text-decoration:none; cursor:pointer; }
    .archive-actions button:hover,.archive-actions a:hover { background:#f2f7fb; }
    .archive-status { padding:16px 18px; border:1px solid var(--line); border-radius:14px; background:#fff; color:var(--muted); margin-bottom:18px; }
    .archive-status.error { border-color:#f0b8b8; color:#9b1c1c; background:#fff8f8; }
    .brief-list { display:grid; gap:18px; }
    .brief-card { background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:0 8px 26px rgba(2,6,23,.07); overflow:hidden; }
    .brief-card-head { display:flex; justify-content:space-between; gap:18px; padding:20px 22px; border-bottom:1px solid var(--line); background:linear-gradient(135deg,#fff,#f7fbff); }
    .brief-card-head h2 { margin:0 0 5px; font-size:1.15rem; color:var(--ink); }
    .brief-meta { margin:0; color:var(--muted); font-size:.86rem; }
    .brief-ref { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.76rem; color:#526a82; text-align:right; word-break:break-all; }
    .field-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); }
    .field { padding:16px 22px; border-bottom:1px solid #edf1f5; }
    .field:nth-child(odd) { border-right:1px solid #edf1f5; }
    .field.full { grid-column:1/-1; border-right:0; }
    .field-label { display:block; margin-bottom:6px; color:#657b91; font-size:.74rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; }
    .field-value { margin:0; color:#173b5d; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere; }
    .empty { text-align:center; padding:44px 22px; background:#fff; border:1px solid var(--line); border-radius:18px; color:var(--muted); }
    .loading { opacity:.7; }
    @media (max-width:700px) {
      body { background:linear-gradient(180deg,#07111f 0 145px,#f5f8fc 145px 100%); }
      .archive-main { width:min(100% - 20px,1100px); padding:30px 0 48px; }
      .archive-toolbar { align-items:stretch; }
      .archive-actions { width:100%; }
      .archive-actions a,.archive-actions button { flex:1; text-align:center; min-height:46px; }
      .brief-card-head { padding:17px; flex-direction:column; }
      .brief-ref { text-align:left; }
      .field-grid { grid-template-columns:1fr; }
      .field,.field.full { grid-column:auto; border-right:0; padding:15px 17px; }
    }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; transition:none!important; } }
  </style>
</head>
<body>
  <header class="legal-topbar" role="banner">
    <div class="legal-topbar-inner">
      <a class="legal-brand" href="/">Impact in Business Recruitment</a>
      <div class="legal-actions">
        <a class="legal-signin" href="/requests.html">Submit Media Brief</a>
      </div>
    </div>
  </header>

  <main class="archive-main" role="main">
    <section class="archive-hero" aria-labelledby="archive-title">
      <h1 id="archive-title">Brief Archive</h1>
      <p>Submitted briefs, recalled from the secure communications archive for the signed-in account.</p>
    </section>

    <div class="archive-toolbar">
      <span class="archive-count" id="archiveCount">Loading archive…</span>
      <div class="archive-actions">
        <button type="button" id="refreshBtn">Refresh</button>
        <a href="/requests.html">New Brief</a>
      </div>
    </div>

    <div class="archive-status loading" id="archiveStatus" role="status">Checking your sign-in…</div>
    <section class="brief-list" id="briefList" aria-live="polite"></section>
  </main>

  <script defer src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.22.2/firebase-functions-compat.js"></script>
  <script defer src="/firebase-config.js"></script>
  <script>
    (function () {
      "use strict";
      var auth, archiveList = document.getElementById("briefList");
      var statusEl = document.getElementById("archiveStatus");
      var countEl = document.getElementById("archiveCount");
      var refreshBtn = document.getElementById("refreshBtn");

      function escapeHtml(value) {
        return String(value == null ? "" : value)
          .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
          .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
      }

      function formatDate(value) {
        if (!value) return "Date unavailable";
        var date = new Date(value);
        return isNaN(date.getTime()) ? "Date unavailable" : date.toLocaleString("en-GB", {
          day:"2-digit", month:"long", year:"numeric", hour:"2-digit", minute:"2-digit"
        });
      }

      function field(label, value, full) {
        var display = value === null || value === undefined || value === "" ? "Not provided" : value;
        return '<div class="field' + (full ? ' full' : '') + '">' +
          '<span class="field-label">' + escapeHtml(label) + '</span>' +
          '<p class="field-value">' + escapeHtml(display) + '</p></div>';
      }

      function renderBriefs(briefs) {
        if (!briefs.length) {
          countEl.textContent = "0 briefs";
          archiveList.innerHTML = '<div class="empty"><strong>No briefs submitted yet.</strong><br>Your completed media briefs will appear here after submission.</div>';
          return;
        }
        countEl.textContent = briefs.length + (briefs.length === 1 ? " brief" : " briefs");
        archiveList.innerHTML = briefs.map(function (brief) {
          return '<article class="brief-card">' +
            '<header class="brief-card-head">' +
              '<div><h2>' + escapeHtml(brief.headline || "Untitled brief") + '</h2>' +
              '<p class="brief-meta">' + escapeHtml(brief.announcementType || "Media brief") + ' · Submitted ' + escapeHtml(formatDate(brief.createdAt)) + '</p></div>' +
              '<div class="brief-ref">Reference<br>' + escapeHtml(brief.id || "Unavailable") + '</div>' +
            '</header>' +
            '<div class="field-grid">' +
              field("Company Name",brief.companyName) +
              field("Press Officer",brief.pressOfficer) +
              field("Officer Email",brief.officerEmail) +
              field("Destination Email",brief.destinationEmail) +
              field("Phone Number",brief.phoneNumber) +
              field("Press Release URL",brief.pressReleaseUrl) +
              field("Headline",brief.headline) +
              field("Announcement Type",brief.announcementType) +
              field("Embargo Date",brief.embargoDate) +
              field("Summary",brief.summary,true) +
              field("Notes",brief.notes,true) +
            '</div></article>';
        }).join("");
      }

      function showStatus(message, error) {
        statusEl.textContent = message;
        statusEl.classList.toggle("error", !!error);
        statusEl.classList.toggle("loading", false);
      }

      async function loadArchive() {
        var user = auth && auth.currentUser;
        if (!user) return;
        refreshBtn.disabled = true;
        showStatus("Loading your submitted briefs…", false);
        try {
          var callable = firebase.app().functions("us-central1").httpsCallable("getPressCommunications");
          var result = await callable({});
          var briefs = result.data && Array.isArray(result.data.briefs) ? result.data.briefs : [];
          renderBriefs(briefs);
          showStatus("Archive loaded for " + (user.email || user.displayName || "your account") + ".", false);
        } catch (error) {
          console.error("Brief archive failed:", error);
          countEl.textContent = "Archive unavailable";
          archiveList.innerHTML = "";
          showStatus(error && error.message ? error.message : "The archive could not be loaded. Please try again.", true);
        } finally {
          refreshBtn.disabled = false;
        }
      }

      function init() {
        try {
          if (!window.firebase || !window.firebaseConfig) throw new Error("Firebase could not be initialized.");
          if (!firebase.apps.length) firebase.initializeApp(window.firebaseConfig);
          auth = firebase.auth();
          auth.onAuthStateChanged(function (user) {
            if (user) {
              loadArchive();
            } else {
              window.location.href = "/login.html?next=%2Farchive.html";
            }
          });
        } catch (error) {
          showStatus(error.message || "Unable to initialize authentication.", true);
        }
      }

      refreshBtn.addEventListener("click", loadArchive);
      init();
    })();
  </script>
</body>
</html>
